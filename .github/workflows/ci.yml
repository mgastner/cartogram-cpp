name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Manual runs on any branch: gh workflow run CI --ref <branch>
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-check:
    name: Style check (clang-format)
    runs-on: ubuntu-26.04
    env:
      # Pinned so that a new release of clang-format cannot make the check fail.
      # The same version can be installed locally with
      # pip install clang-format==<version>.
      CLANG_FORMAT_VERSION: 21.1.8

    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          python3 -m venv .venv
          .venv/bin/pip install "clang-format==${CLANG_FORMAT_VERSION}"
          echo "CLANG_FORMAT=$PWD/.venv/bin/clang-format" >> $GITHUB_ENV

      - name: Check formatting
        run: |
          mapfile -t FILES < <(git ls-files '*.[ch]pp' '*.c' '*.h')
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No source files to check"; exit 0
          fi
          echo "clang-format version: $($CLANG_FORMAT --version)"
          echo "Running clang-format diff..."
          bad_files=()

          for f in "${FILES[@]}"; do
            CF_CMD="$CLANG_FORMAT -style=file $f"

            if ! diff -u "$f" <($CF_CMD); then
              echo "::group::❌ $f"
              echo "Command: $CF_CMD"
              diff -u "$f" <($CF_CMD) || true
              echo "::endgroup::"
              bad_files+=("$f")
            fi
          done

          if [ ${#bad_files[@]} -ne 0 ]; then
            file_list=$(printf '%s\n' "${bad_files[@]}")
            file_list_escaped=${file_list//$'\n'/%0A}
            echo "::error::clang-format issues detected in the following files:%0A${file_list_escaped}%0ARun 'clang-format -i' with clang-format ${CLANG_FORMAT_VERSION} to fix."
            exit 1
          fi

  docs-check:
    name: Docs check
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo npm install -g markdown-link-check@^3 markdownlint-cli2@^0 cspell@^8

      - name: Check broken links
        run: |
          markdown-link-check -q -c .markdown-link-check.json README.md

      - name: Check typos
        run: |
          if ! npx cspell "README.md" --no-progress --no-summary; then
                echo "::error::cspell found unknown words. \
          If a word is correct, add it to .cspell.json under \"words\"."
                exit 1
              fi

      - name: Check formatting
        run: |
          markdownlint-cli2 README.md

  # Each job tests the binaries on the runner that built them. CMakeLists.txt
  # compiles with -march=native, so a binary may use instructions, such as
  # AVX-512, that the CPU of another runner lacks.
  build-and-test:
    name: "Build and test (${{ matrix.name }})"
    runs-on: ${{ matrix.os }}
    needs: [style-check, docs-check]
    strategy:
      fail-fast: false # Make sure if one build fails, others can still run
      matrix:
        include:
          # Linux
          - os: ubuntu-26.04
            compiler: gcc
            version: 15
            build_type: Release
            name: ubuntu-release-gcc
          - os: ubuntu-26.04
            compiler: clang
            version: 22
            build_type: Release
            name: ubuntu-release-clang
          - os: ubuntu-26.04
            compiler: gcc
            version: 15
            build_type: Debug
            name: ubuntu-debug-gcc
          - os: ubuntu-26.04
            compiler: clang
            version: 22
            build_type: Debug
            name: ubuntu-debug-clang
          # Linux arm
          - os: ubuntu-26.04-arm
            compiler: clang
            version: 22
            build_type: Release
            name: ubuntu-arm64-release-clang
          - os: ubuntu-26.04-arm
            compiler: clang
            version: 22
            build_type: Debug
            name: ubuntu-arm64-debug-clang
          # macOS
          - os: macos-26
            compiler: apple-clang
            version: ""
            build_type: Release
            name: macos-release-appleclang
          - os: macos-26
            compiler: apple-clang
            version: ""
            build_type: Debug
            name: macos-debug-appleclang

    steps:
      - uses: actions/checkout@v7

      - name: Install compiler (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            sudo apt-get install -y gcc-${{ matrix.version }} g++-${{ matrix.version }}
            echo "CC=gcc-${{ matrix.version }}"  >> $GITHUB_ENV
            echo "CXX=g++-${{ matrix.version }}" >> $GITHUB_ENV
          else
            sudo apt-get install -y clang-${{ matrix.version }} lld
            echo "CC=clang-${{ matrix.version }}"   >> $GITHUB_ENV
            echo "CXX=clang++-${{ matrix.version }}" >> $GITHUB_ENV
          fi

      - name: Setup Python & Conan
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -U -r requirements.txt
          conan remote update conancenter --url=https://center2.conan.io
          conan profile detect
          # The CGAL recipe requires mpfr 4.2.1, whose configure script fails with
          # clang on Ubuntu 26.04 (x86_64). Version 4.2.2 fixes the script.
          printf '\n[replace_requires]\nmpfr/4.2.1: mpfr/4.2.2\n' >> "$(conan profile path default)"

      - name: Download Dependencies
        run: |
          source .venv/bin/activate
          conan install . \
            --output-folder build \
            --build=missing \
            -s build_type=${{ matrix.build_type }} \
            -s compiler.cppstd=20 \
            -o "*:shared=False" \
            -o "*:fPIC=False"

      - name: Configure & build
        id: build
        run: |
          source .venv/bin/activate

          if [[ "${{ runner.os }}" == "Linux" ]]; then
              FIND_SUFFIX='-DCMAKE_FIND_LIBRARY_SUFFIXES=.a'
              EXE_FLAGS='-static -static-libstdc++ -static-libgcc -pthread'
          else
              FIND_SUFFIX=''
              EXE_FLAGS=''
          fi

          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=build/build/${{ matrix.build_type }}/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            ${FIND_SUFFIX} \
            -DCMAKE_EXE_LINKER_FLAGS="${EXE_FLAGS}"
          cmake --build build -j$(nproc || sysctl -n hw.ncpu)

      - name: Unit tests
        run: |
          ctest --test-dir build -L unit --output-on-failure

      # The stress tests also run if the unit tests fail, so that each run
      # reports the results of both.
      - name: Stress tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          ctest --test-dir build -L stress --output-on-failure

      # Disabled. The fuzzer tests ran on ubuntu-release-gcc,
      # ubuntu-release-clang, and macos-release-appleclang.
      # - name: Fuzzer tests
      #   if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.build_type == 'Release' && matrix.os != 'ubuntu-26.04-arm' }}
      #   run: |
      #     ctest --test-dir build -L fuzzer --verbose

      # The static binaries of the Linux release builds can be downloaded from
      # the run, for example to attach them to a release. They are compiled
      # with -march=native, so they may need the instruction set of the CPU of
      # the runner. The binary is packed with tar because upload-artifact does
      # not keep the executable bit. The upload runs only if the tests passed.
      - name: Pack binary
        if: runner.os == 'Linux' && matrix.build_type == 'Release'
        run: tar -czf cartogram-${{ matrix.name }}.tar.gz -C build cartogram

      - name: Upload binary
        if: runner.os == 'Linux' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: cartogram-${{ matrix.name }}
          path: cartogram-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  build-and-test-sanitize:
    name: "Build and test (${{ matrix.san }})"
    runs-on: ubuntu-26.04
    needs: [style-check, docs-check]

    strategy:
      fail-fast: false
      matrix:
        include:
          # ASan and UBSan can be used together, but TSan is incompatible with ASan.
          # But we keep ASan and UBSan builds separate separate because it isolates
          # memory- and UB-errors for clearer diagnostics.
          - san: asan # AddressSanitizer + LeakSanitizer (ASan + LSAn)
            flag: address,leak
          - san: ubsan # UndefinedBehaviorSanitizer
            flag: undefined
          - san: tsan # ThreadSanitizer
            flag: thread

    steps:
      - uses: actions/checkout@v7

      # We only run sanitizers on Linux with Clang, since GCC's support is less mature
      # and sanitizer support on macOS is incomplete.
      - name: Install clang-22
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-22 lld-22
          echo "CC=clang-22"    >> $GITHUB_ENV
          echo "CXX=clang++-22" >> $GITHUB_ENV

      - name: Setup Python & Conan
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -U -r requirements.txt
          conan remote update conancenter --url=https://center2.conan.io
          conan profile detect
          # The CGAL recipe requires mpfr 4.2.1, whose configure script fails with
          # clang on Ubuntu 26.04 (x86_64). Version 4.2.2 fixes the script.
          printf '\n[replace_requires]\nmpfr/4.2.1: mpfr/4.2.2\n' >> "$(conan profile path default)"

      - name: Download dependencies
        run: |
          source .venv/bin/activate
          conan install . \
            --output-folder build \
            --build=missing \
            -s build_type=Debug \
            -s compiler.cppstd=20 \
            -o "*:shared=False"

      - name: Configure & build
        id: build
        run: |
          source .venv/bin/activate
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=build/build/Debug/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.flag }} -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.flag }}"
          cmake --build build -j$(nproc)

      - name: Unit tests
        run: |
          ctest --test-dir build -L unit --output-on-failure

      - name: Stress tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          ctest --test-dir build -L stress --output-on-failure

  # ──────────────────── Performance comparison ────────────────────
  # Both binaries are built on the runner that benchmarks them, and with the
  # same options. CMakeLists.txt compiles with -march=native, so a binary built
  # on another runner may use instructions that the CPU of this runner lacks.
  perf-tests:
    if: github.event_name == 'pull_request'
    name: Performance comparison (main, ${{ matrix.name }})
    needs: [style-check, docs-check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            compiler: clang
            version: 22
            build_type: Release
            name: ubuntu-release-clang

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Only designed to work on Linux
      - name: Install compiler & hyperfine
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ${{ matrix.compiler }}-${{ matrix.version }} \
            lld hyperfine python3-venv
          echo "CC=${{ matrix.compiler }}-${{ matrix.version }}"   >> $GITHUB_ENV
          echo "CXX=${{ matrix.compiler }}++-${{ matrix.version }}" >> $GITHUB_ENV

      - name: Setup Python & Conan
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -U -r requirements.txt
          conan remote update conancenter --url=https://center2.conan.io
          conan profile detect
          # The CGAL recipe requires mpfr 4.2.1, whose configure script fails with
          # clang on Ubuntu 26.04 (x86_64). Version 4.2.2 fixes the script.
          printf '\n[replace_requires]\nmpfr/4.2.1: mpfr/4.2.2\n' >> "$(conan profile path default)"

      - name: Check out baseline (origin/main)
        run: |
          git fetch --depth 1 --no-tags origin main
          git worktree add ../baseline origin/main

      # The second build reuses the Conan packages of the first if the two
      # source trees require the same versions.
      - name: Build PR & baseline
        run: |
          source .venv/bin/activate
          for src in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/../baseline"; do
            pushd "$src"
            conan install . --output-folder build \
                            --build missing \
                            -s build_type=${{ matrix.build_type }} \
                            -s compiler.cppstd=20 \
                            -o "*:shared=False"
            cmake -S . -B build \
                  -DCMAKE_TOOLCHAIN_FILE=build/build/${{ matrix.build_type }}/generators/conan_toolchain.cmake \
                  -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                  -DBUILD_SHARED_LIBS=OFF
            cmake --build build --target cartogram -j"$(nproc)"
            popd
          done

      # Benchmarks
      - name: Benchmark sample_data maps
        run: |
          source .venv/bin/activate
          bash .github/scripts/benchmark_maps.sh \
            build/cartogram \
            ../baseline/build/cartogram \
            results.json

      # Generate performance report
      - name: Create performance report
        run: |
          source .venv/bin/activate
          pip install --upgrade scipy
          python .github/scripts/gen_perf_comment.py results.json comment.md

      # When PR is made from fork, the pull_request will be empty during workflow_run in
      # pr-comment.yml. So, we also pass the PR number as artifact
      - name: Save PR number
        run: echo "${{ github.event.number }}" > pr_number.txt

      # Upload report for the pr-comment.yml workflow
      - name: Upload performance report & PR number
        uses: actions/upload-artifact@v7
        with:
          name: perf-comment # If this name changes, update the pr-comment.yml workflow too
          path: |
            comment.md
            pr_number.txt
